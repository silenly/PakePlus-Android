/* Canvas 手绘体重折线图 */
function drawChart(){
  var cv = $('wChart'); if(!cv) return;
  var wrap = cv.parentElement;
  var w = Math.max(240, wrap.clientWidth);
  var h = 230;
  var dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var tip = $('chartTip');
  var all = sortedWeights();
  var pts = all;
  if(data.settings.chartRange === '30'){
    var limit = ymd(addDays(today(), -29));
    pts = all.filter(function(p){ return p.date >= limit; });
  }
  if(tip) tip.hidden = pts.length > 0;
  if(!pts.length) return;

  var accent = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#FF7A45';
  var padL = 46, padR = 14, padT = 16, padB = 30;
  var cw = w - padL - padR, ch = h - padT - padB;

  // 纵轴范围
  var vals = pts.map(function(p){ return p.kg; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(max - min < 2){ var mid = (max + min) / 2; min = mid - 1; max = mid + 1; }
  var lo = Math.floor((min - 0.5) * 2) / 2, hi = Math.ceil((max + 0.5) * 2) / 2;

  /* ---- X 轴：按真实日期天数线性映射（关键修复） ----
   * 横轴跨度 = 最早记录日 ~ 最新记录日的总天数；
   * 每个点的 X = (该点日期 - 起始日期) / 总天数 × 图表宽度，
   * 因此隔几天的两个点，像素距离就对应几天，不再是等距排开。
   * 「最近 30 天」视图下跨度固定为 30 天，没有记录的日期留空。
   */
  var dStart, dEnd;
  if(data.settings.chartRange === '30'){
    dEnd = pts[pts.length - 1].date;
    dStart = ymd(addDays(parseYmd(dEnd), -29));
  }else{
    dStart = pts[0].date;
    dEnd = pts[pts.length - 1].date;
  }
  var spanDays = Math.max(1, diffDays(dStart, dEnd));
  var single = (pts.length === 1);
  function XD(dstr){
    if(single) return padL + cw / 2;                 // 只有一个点时居中
    var t = diffDays(dStart, dstr) / spanDays;
    if(t < 0) t = 0; if(t > 1) t = 1;
    return padL + cw * t;
  }
  function Y(v){ return padT + ch * (1 - (v - lo) / (hi - lo)); }

  /* ---- 背景周期色带：经期 / 排卵期 / 黄体期 ---- */
  if((data.period.records || []).length){
    var dCur = dStart, guard = 0;
    while(dCur <= dEnd && guard < 900){
      var pc = periodCalc(dCur);
      if(pc && BAND_COLOR[pc.phase]){
        var bx1 = XD(dCur), bx2 = XD(ymd(addDays(parseYmd(dCur), 1)));
        ctx.fillStyle = BAND_COLOR[pc.phase];
        ctx.fillRect(bx1, padT, Math.max(1.5, bx2 - bx1), ch);
      }
      dCur = ymd(addDays(parseYmd(dCur), 1));
      guard++;
    }
  }

  // 纵向网格 + 纵轴刻度（纵轴仍按体重数值自适应）
  ctx.font = '11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(var g=0; g<=4; g++){
    var v = lo + (hi - lo) * g / 4;
    var y = Y(v);
    ctx.strokeStyle = '#EEF1F5'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = '#9AA1AB';
    ctx.fillText(v.toFixed(1), padL - 8, y);
  }

  /* ---- X 轴刻度：按数据密度自动决定标注几个日期 ---- */
  var tickN = Math.min(6, Math.max(2, Math.round(cw / 80)));
  var ticks = [], seen = {};
  for(var ti=0; ti<tickN; ti++){
    var frac = tickN === 1 ? 0 : ti / (tickN - 1);
    var td = ymd(addDays(parseYmd(dStart), Math.round(frac * spanDays)));
    if(seen[td]) continue;
    seen[td] = 1; ticks.push(td);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ticks.forEach(function(td){
    var tx = XD(td);
    ctx.strokeStyle = '#F2F4F7'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tx, padT); ctx.lineTo(tx, padT + ch); ctx.stroke();
    ctx.fillStyle = '#9AA1AB';
    ctx.fillText(td.slice(5), tx, padT + ch + 8);
  });

  // 折线（各点按真实日期落位）
  ctx.strokeStyle = accent; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach(function(p, i){ if(i === 0) ctx.moveTo(XD(p.date), Y(p.kg)); else ctx.lineTo(XD(p.date), Y(p.kg)); });
  ctx.stroke();
  // 面积（淡色）
  if(pts.length > 1){
    ctx.lineTo(XD(pts[pts.length-1].date), padT + ch);
    ctx.lineTo(XD(pts[0].date), padT + ch);
    ctx.closePath();
    ctx.fillStyle = hexToRgba(accent, .10); ctx.fill();
  }
  // 数据点
  pts.forEach(function(p){
    var x = XD(p.date), y = Y(p.kg);
    ctx.beginPath(); ctx.arc(x, y, 3.6, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = accent; ctx.stroke();
  });
}
function hexToRgba(hex, a){
  var h = String(hex).replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* =====================================================================
 *  组间追踪器：内嵌在每个无氧动作条目里
 *  流程：开始第 1 组 → 完成第 1 组 → 自动组歇倒计时 → 提醒第 2 组 → … → 全部完成
 * ===================================================================== */
var audioCtx = null;

/* WebAudio 提示音，不引入任何音频文件；浏览器不支持时静默降级 */
function beep(times){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!audioCtx) audioCtx = new Ctx();
    if(audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    var n = times || 3;
    for(var i=0; i<n; i++){
      (function(idx){
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = (idx === n - 1) ? 1046 : 880;   // 最后一声音调更高
        var t0 = audioCtx.currentTime + idx * 0.28;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.24);
      })(i);
    }
  }catch(e){ /* 静默降级，不影响主流程 */ }
}
/* 条目颜色闪烁提醒 */
function flashItem(id){
  var el = document.getElementById('stitem-' + id);
  if(!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;                       // 强制重排，保证动画可重复触发
  el.classList.add('flash');
  setTimeout(function(){ el.classList.remove('flash'); }, 1500);
}
/* 按 id 找到当天某个无氧动作 */
function findStrength(ds, id){
  var d = data.fitness && data.fitness[ds];
  if(!d) return null;
  for(var i=0; i<d.strength.length; i++) if(d.strength[i].id === id) return d.strength[i];
  return null;
}
/* 主按钮：开始第 1 组 / 完成第 N 组 */
function onStrengthMain(id){
  var ds = ymd(selected);
  var it = findStrength(ds, id);
  if(!it){ toast('动作不存在', 'err'); return; }
  var plan = num(it.sets);
  if(plan <= 0){ toast('请先把「计划组数」设为大于 0', 'warn'); return; }
  var done = num(it.done);
  if(done === 0 && !it.startedAt){           // 第一次点击：开始第 1 组
    it.startedAt = Date.now();
    save(); renderDetail();
    toast(it.name + ' 第 1 组，开始！', 'ok');
    return;
  }
  done += 1;                                  // 完成当前这一组
  it.done = done;
  it.finishedAt = Date.now();
  if(done >= plan){                           // 已完成全部计划组数
    it.totalSec = Math.round((it.finishedAt - (it.startedAt || it.finishedAt)) / 1000);
    it.restEndAt = 0;
    save(); renderAll();
    toast('🎉 ' + it.name + ' 全部完成！' + plan + ' 组，实测耗时 ' + fmtDuration(it.totalSec), 'ok');
    beep(2); flashItem(id);
    return;
  }
  startRest(it);                              // 还没到最后一组 → 自动进入组歇
}
/* 启动该动作的组歇倒计时（restEndAt 落盘，刷新页面也能继续计时） */
function startRest(it){
  var sec = Math.max(0, Math.round(num(it.rest)));
  if(sec <= 0){                               // 组歇为 0 秒：直接提示下一组
    it.restEndAt = 0;
    save(); renderDetail();
    toast(it.name + ' 第 ' + (num(it.done) + 1) + ' 组，可以开始了', 'ok');
    beep(); flashItem(it.id);
    return;
  }
  it.restEndAt = Date.now() + sec * 1000;
  it.restTotal = sec;
  save(); renderDetail();
  toast('休息 ' + sec + ' 秒，随后开始第 ' + (num(it.done) + 1) + ' 组');
}
/* 跳过本组休息 */
function onStrengthSkip(id){
  var it = findStrength(ymd(selected), id);
  if(!it) return;
  it.restEndAt = 0;
  var nm = it.name, next = num(it.done) + 1;
  save(); renderDetail();
  toast(nm + ' 第 ' + next + ' 组，可以开始了', 'ok');
  beep(); flashItem(id);
}
/* 中断 / 重置该动作今天的训练 */
function onStrengthReset(id){
  var it = findStrength(ymd(selected), id);
  if(!it) return;
  confirmBox('中断并重置「' + it.name + '」今天的训练进度？已完成的组数会清零。', function(){
    it.done = 0; it.startedAt = 0; it.finishedAt = 0; it.totalSec = 0; it.restEndAt = 0;
    save(); renderAll();
    toast('已重置「' + it.name + '」的训练进度', 'ok');
  });
}
/* 有氧：找到某天的某条记录 */
function findCardio(ds, id){
  var day = data.fitness[ds]; if(!day) return null;
  for(var i=0;i<day.cardio.length;i++){ if(day.cardio[i].id === id) return day.cardio[i]; }
  return null;
}
/* 有氧「完成」：标记 done=1，计入当日有氧时长与消耗（实际用时即录入的时长，可在编辑里修改） */
function onCardioComplete(id){
  var it = findCardio(ymd(selected), id);
  if(!it){ toast('记录不存在', 'err'); return; }
  it.done = 1;
  save(); renderAll();
  toast('已记录「' + (it.type || '有氧') + '」完成' +
        (num(it.minutes) ? '（' + num(it.minutes) + ' min）' : '') + '，已计入汇总', 'ok');
}
/* 有氧「撤销完成」：取消 done 标记，移出汇总 */
function onCardioUncomplete(id){
  var it = findCardio(ymd(selected), id);
  if(!it) return;
  it.done = 0;
  save(); renderAll();
  toast('已撤销「' + (it.type || '有氧') + '」的完成状态', 'ok');
}
/* 每 200ms 刷新处于休息中的条目，倒计时结束时提示 + 声音 + 闪烁 */
function tickTrackers(){
  var curDs = ymd(selected);
  var ended = false, needRender = false, notify = null;
  // 遍历全部日期：即使切到饮食/学习模式或翻到别的日期，组歇也照常走完并提醒
  Object.keys(data.fitness || {}).forEach(function(ds){
    var d = data.fitness[ds];
    if(!d || !d.strength) return;
    d.strength.forEach(function(it){
      if(!it.restEndAt) return;
      var left = Math.max(0, it.restEndAt - Date.now());
      if(ds === curDs && mode === 'fitness'){      // 只有当前显示的那天需要刷新 DOM
        var btn = document.getElementById('stbtn-' + it.id);
        var bar = document.getElementById('stbar-' + it.id);
        if(btn) btn.textContent = '休息中 ' + Math.ceil(left / 1000) + 's';
        if(bar && bar.firstChild){
          var total = num(it.restTotal || it.rest || 60) * 1000;
          bar.firstChild.style.width = (left / total * 100) + '%';
        }
      }
      if(left <= 0){
        it.restEndAt = 0;
        ended = true;
        if(ds === curDs) needRender = true;
        notify = { name: it.name, next: num(it.done) + 1, id: it.id, ds: ds };
      }
    });
  });
  if(!ended) return;
  save();
  if(needRender) renderDetail();
  if(notify){
    toast(notify.name + ' 第 ' + notify.next + ' 组，可以开始了', 'ok');
    beep(); flashItem(notify.id);
  }
}
setInterval(tickTrackers, 200);

var modalOkHandler = null;
function openModal(){

}
function closeModal(){

/* 通用表单：fields=[{key,label,type,ph,required,min,step}] */
function showForm(opt){
  $('modalTitle').textContent = opt.title || '编辑';
  $('modalMsg').hidden = true;
  var body = $('modalBody');
  body.hidden = false;
  var html = opt.extraTop || '';                 // 收藏夹标签（字段上方）
  opt.fields.forEach(function(f){
    var v = (opt.values && opt.values[f.key] !== undefined && opt.values[f.key] !== null) ? opt.values[f.key] : '';
    if(f.type === 'textarea'){
      html += '<label class="fld"><span>' + esc(f.label) + '</span><textarea data-k="' + f.key + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea></label>';
    }else{
      html += '<label class="fld"><span>' + esc(f.label) + '</span><input type="' + (f.type || 'text') + '" data-k="' + f.key +
              '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '"' +
              (f.min !== undefined ? ' min="' + f.min + '"' : '') + (f.step ? ' step="' + f.step + '"' : '') + '></label>';
    }
    // 指定字段后面追加内容（例如名称输入框下方的「收藏」星形按钮）
    if(opt.inject && opt.inject[f.key]) html += opt.inject[f.key];
  });
  body.innerHTML = html;
  $('modalOk').textContent = opt.okText || '保存';
  if(opt.onMount) opt.onMount(body);             // 表单渲染完成后绑定交互
  modalOkHandler = function(){
    var vals = {}, ok = true;
    opt.fields.forEach(function(f){
      var el = body.querySelector('[data-k="' + f.key + '"]');
      var raw = el ? el.value.trim() : '';
      if(f.required && raw === ''){ ok = false; toast('请填写「' + f.label + '」', 'warn'); return; }
      vals[f.key] = (f.type === 'number') ? (raw === '' ? '' : num(raw)) : raw;
    });
    if(!ok) return;
    closeModal();
    opt.onOk(vals);
  };
  openModal();
  var first = body.querySelector('input,textarea');
  if(first) setTimeout(function(){ first.focus(); }, 60);
}

 * ===================================================================== */
function renderMonthStat(){
  var y = cursor.getFullYear(), m = cursor.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  var cnt = 0, rows = '';
  if(mode === 'fitness'){
    var sm = 0, cm = 0, kcal = 0;
    for(var d=1; d<=days; d++){
      var ds = y + '-' + pad2(m+1) + '-' + pad2(d);
      if(hasRecord('fitness', ds)) cnt++;
      var s = fitSummary(ds); sm += s.strengthMin; cm += s.cardioMin; kcal += s.kcal;
    }
    rows = '<div class="stat-row"><span>训练天数</span><b>' + cnt + ' 天</b></div>' +
           '<div class="stat-row"><span>无氧累计</span><b>' + Math.round(sm) + ' min</b></div>' +
           '<div class="stat-row"><span>有氧累计</span><b>' + Math.round(cm) + ' min</b></div>' +
           '<div class="stat-row"><span>消耗累计</span><b>' + kcal + ' kcal</b></div>';
  }else if(mode === 'diet'){

    for(var d2=1; d2<=days; d2++){
      var ds2 = y + '-' + pad2(m+1) + '-' + pad2(d2);

           '<div class="stat-row"><span>热量累计</span><b>' + Math.round(tk) + ' kcal</b></div>' +
           '<div class="stat-row"><span>日均热量</span><b>' + (rec ? Math.round(tk/rec) : 0) + ' kcal</b></div>' +
           '<div class="stat-row"><span>蛋白累计</span><b>' + Math.round(tp) + ' g</b></div>';
  }else if(mode === 'period'){
    var pd = 0, inMonth = 0;
    for(var d4=1; d4<=days; d4++){
      var ds4 = y + '-' + pad2(m+1) + '-' + pad2(d4);

      if(hasRecord('study', ds3)){ rc++; tm += studySummary(ds3).minutes; }
    }
    rows = '<div class="stat-row"><span>学习天数</span><b>' + rc + ' 天</b></div>' +
           '<div class="stat-row"><span>时长累计</span><b>' + Math.round(tm) + ' min</b></div>' +
           '<div class="stat-row"><span>日均时长</span><b>' + (rc ? Math.round(tm/rc) : 0) + ' min</b></div>';

/* ---- 本周概览：选中日期所在周的周一 ~ 周日 ---- */
function weekRangeOf(d){
  var wd = d.getDay();                     // 0 = 周日
  var back = (wd === 0 ? 6 : wd - 1);      // 以周一为一周起点
  var mon = addDays(d, -back);
  return { mon: mon, sun: addDays(mon, 6) };
}
/* 找某日期附近（±3 天内）的体重记录 */
function weightNear(ds){
  var best = null, bestGap = 999;
  data.weights.forEach(function(w){
    var g = Math.abs(diffDays(w.date, ds));
    if(g <= 3 && g < bestGap){ bestGap = g; best = w; }
  });
  return best;
}
function renderWeekStat(){
  var r = weekRangeOf(selected);
  var mds = ymd(r.mon), sds = ymd(r.sun);
  var rows = '', i, ds, s, t;
  if(mode === 'fitness'){
    var days = 0, sm = 0, cm = 0, kcal = 0;
    for(i = 0; i < 7; i++){
      ds = ymd(addDays(r.mon, i));
      if(hasRecord('fitness', ds)) days++;
      s = fitSummary(ds); sm += s.strengthMin; cm += s.cardioMin; kcal += s.kcal;
    }
    rows = '<div class="stat-row"><span>训练天数</span><b>' + days + ' 天</b></div>' +
           '<div class="stat-row"><span>无氧总时长</span><b>' + Math.round(sm) + ' min</b></div>' +
           '<div class="stat-row"><span>有氧总时长</span><b>' + Math.round(cm) + ' min</b></div>' +
           '<div class="stat-row"><span>总消耗</span><b>' + kcal + ' kcal</b></div>';
  }else if(mode === 'diet'){
    var rec = 0, tk = 0, tp = 0;
    for(i = 0; i < 7; i++){
      ds = ymd(addDays(r.mon, i));
      if(hasRecord('diet', ds)){ rec++; t = dietSummary(ds); tk += t.kcal; tp += t.protein; }
    }
    rows = '<div class="stat-row"><span>记录天数</span><b>' + rec + ' 天</b></div>' +
           '<div class="stat-row"><span>日均卡路里</span><b>' + (rec ? Math.round(tk / rec) : 0) + ' kcal</b></div>' +
           '<div class="stat-row"><span>日均蛋白质</span><b>' + (rec ? Math.round(tp / rec) : 0) + ' g</b></div>';
  }else if(mode === 'study'){
    var sd = 0, tm = 0;
    for(i = 0; i < 7; i++){
      ds = ymd(addDays(r.mon, i));
      if(hasRecord('study', ds)){ sd++; tm += studySummary(ds).minutes; }
    }
    rows = '<div class="stat-row"><span>学习天数</span><b>' + sd + ' 天</b></div>' +
           '<div class="stat-row"><span>学习总时长</span><b>' + Math.round(tm) + ' min</b></div>' +
           '<div class="stat-row"><span>日均时长</span><b>' + (sd ? Math.round(tm / sd) : 0) + ' min</b></div>';
  }else{
    var pd = 0;
    for(i = 0; i < 7; i++){ ds = ymd(addDays(r.mon, i)); if(isPeriodDay(ds)) pd++; }
    rows = '<div class="stat-row"><span>经期天数</span><b>' + pd + ' 天</b></div>';
  }
  // 体重：周一 vs 周日
  var wm = weightNear(mds), ws = weightNear(sds);
  var wtxt = '<span style="color:var(--muted)">—</span>';
  if(wm && ws){
    var dv = Math.round((ws.kg - wm.kg) * 10) / 10;
    wtxt = dv > 0 ? '<span style="color:#E8453C">↑ +' + dv + ' kg</span>'
         : (dv < 0 ? '<span style="color:#2FA84F">↓ ' + Math.abs(dv) + ' kg</span>'
                   : '<span style="color:var(--muted)">持平 0 kg</span>');
  }
  rows += '<div class="stat-row"><span>体重 周一→周日</span><b style="font-size:13px">' + wtxt + '</b></div>';
  $('weekStat').innerHTML = '<div class="stat-title">本周概览 ' + mds.slice(5) + ' ~ ' + sds.slice(5) + '</div>' + rows;
}

/* =====================================================================
 *  训练计划 导出 / 导入（仅健身计划，与全量备份相互独立）
 * ===================================================================== */
/* 从一个日期区间生成训练计划 JSON（只含计划内容，不含完成态/备注/饮食/经期/体重） */
function exportTrainingPlan(startStr, endStr){
  var d = parseYmd(startStr), e = parseYmd(endStr);
  if(e < d){ var t = d; d = e; e = t; }              // 起止顺序容错
  var days = [];
  for(var cur = new Date(d.getTime()); cur <= e; cur = addDays(cur, 1)){
    var ds = ymd(cur);
    var fd = data.fitness[ds];
    if(!fd) continue;
    var hasPlan = (fd.strength && fd.strength.length) || (fd.cardio && fd.cardio.length) || (fd.parts && fd.parts.length);
    if(!hasPlan) continue;                            // 无计划的日期不出现
    var dayObj = { date: ds };
    if(fd.parts && fd.parts.length) dayObj.parts = fd.parts.slice();
    if(fd.strength && fd.strength.length){
      dayObj.strength = fd.strength.map(function(it){
        var o = { name: it.name };
        o.sets = num(it.sets); o.reps = num(it.reps); o.weight = num(it.weight); o.restSec = num(it.rest);
        return o;
      });
    }
    if(fd.cardio && fd.cardio.length){
      dayObj.cardio = fd.cardio.map(function(it){
        var o = { name: it.type };
        o.minutes = num(it.minutes); o.distance = num(it.distance); o.kcal = num(it.calories);
        return o;
      });
    }
    days.push(dayObj);
  }
  return { type:'training-plan', version:1, days: days };
}
/* 把导入的对象写入 data.fitness（mode: 'overwrite' | 'append'）；imported 的条目默认未开始 */
function writeTrainingPlan(obj, mode){
  var written = 0;
  (obj.days || []).forEach(function(day){
    var fd = data.fitness[day.date] || { strength:[], cardio:[], parts:[] };
    if(!fd.strength) fd.strength = [];
    if(!fd.cardio) fd.cardio = [];
    if(!fd.parts) fd.parts = [];
    var ns = (day.strength || []).map(function(it){
      return {
        id: uid(), name: it.name, sets: num(it.sets), reps: num(it.reps), weight: num(it.weight),
        rest: num(it.restSec != null ? it.restSec : it.rest), minutes: '', note: '',
        done: 0, startedAt: 0, finishedAt: 0, totalSec: 0, restEndAt: 0
      };
    });
    var nc = (day.cardio || []).map(function(it){
      return {
        id: uid(), type: it.name, minutes: num(it.minutes), distance: num(it.distance),
        calories: num(it.kcal != null ? it.kcal : it.calories), note: '', done: 0
      };
    });
    var np = (day.parts || []).slice();
    if(mode === 'overwrite'){
      fd.strength = ns; fd.cardio = nc; fd.parts = np;
    }else{
      fd.strength = fd.strength.concat(ns);
      fd.cardio = fd.cardio.concat(nc);
      np.forEach(function(p){ if(fd.parts.indexOf(p) < 0) fd.parts.push(p); });
    }
    data.fitness[day.date] = fd;
    written++;
  });
  save(); renderAll();
  toast('已导入 ' + written + ' 天训练计划（默认未开始）', 'ok');
}
/* 校验并解析训练计划 JSON，返回对象；出错抛异常 */
function parseTrainingPlan(text){
  var obj;
  try{ obj = JSON.parse(text); }
  catch(err){ throw new Error('JSON 解析失败：' + err.message); }
  if(!obj || typeof obj !== 'object') throw new Error('内容不是有效的 JSON 对象');
  if(obj.type !== 'training-plan') throw new Error('type 必须为 "training-plan"，这是训练计划文件才能导入');
  if(!Array.isArray(obj.days)) throw new Error('缺少 days 数组，无法导入');
  obj.days.forEach(function(day, i){
    if(!day || typeof day !== 'object') throw new Error('第 ' + (i+1) + ' 天不是对象');
    if(!day.date || !/^\d{4}-\d{2}-\d{2}$/.test(day.date)) throw new Error('第 ' + (i+1) + ' 天 date 缺失或格式应为 YYYY-MM-DD');
  });
  return obj;
}
/* 导出训练计划弹窗 */
function openExportPlanModal(){
  $('modalTitle').textContent = '导出训练计划';
  $('modalMsg').hidden = true;
  var body = $('modalBody');
  body.hidden = false;
  var end = today(), start = addDays(end, -6);
  body.innerHTML =
    '<div class="plan-modal">' +
      '<div class="row2"><label>开始</label><input type="date" id="planStart" value="' + ymd(start) + '"></div>' +
      '<div class="row2"><label>结束</label><input type="date" id="planEnd" value="' + ymd(end) + '"></div>' +
      '<div class="hint">仅导出区间内含健身计划（动作 / 有氧 / 训练部位）的日期，无计划的自动跳过；不含饮食、经期、体重及完成状态。</div>' +
      '<div class="modal-actions"><button class="btn primary" id="planGen">生成 JSON</button>' +
        '<button class="btn" id="planClose">关闭</button></div>' +
      '<textarea id="planOut" class="plan-json" readonly style="display:none"></textarea>' +
      '<div class="modal-actions" id="planCopyRow" style="display:none">' +
        '<button class="btn" id="planCopy">复制</button>' +
        '<span class="hint" style="margin:0;padding:0;background:none;border:none">点文本框可选中，按钮复制到剪贴板</span></div>' +
    '</div>';
  $('modalCancel').hidden = true; $('modalOk').hidden = true;
  openModal();
  body.querySelector('#planGen').onclick = function(){
    var s = body.querySelector('#planStart').value, e = body.querySelector('#planEnd').value;
    if(!s || !e){ toast('请选择开始和结束日期', 'warn'); return; }
    var json = exportTrainingPlan(s, e);
    var out = body.querySelector('#planOut');
    out.value = JSON.stringify(json, null, 2);
    out.style.display = 'block';
    body.querySelector('#planCopyRow').style.display = 'flex';
    toast('已生成 ' + json.days.length + ' 天计划', 'ok');
  };
  body.querySelector('#planClose').onclick = closeModal;
  body.querySelector('#planCopy').onclick = function(){
    var out = body.querySelector('#planOut');
    out.focus(); out.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(err){ ok = false; }
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(out.value).catch(function(){}); }
    toast('已复制到剪贴板', 'ok');
  };
}
/* 导入训练计划弹窗 */
function openImportPlanModal(){
  $('modalTitle').textContent = '导入训练计划';
  $('modalMsg').hidden = true;
  var body = $('modalBody');
  body.hidden = false;
  body.innerHTML =
    '<div class="plan-modal">' +
      '<div class="hint">粘贴之前导出的训练计划 JSON（type 必须为 "training-plan"）。导入后计划默认「未开始」，当天训练时再走组间流程标记完成。</div>' +
      '<textarea id="planIn" class="plan-json" placeholder="在此粘贴训练计划 JSON…" style="display:block;height:200px"></textarea>' +
      '<div class="modal-actions"><button class="btn primary" id="planDoImport">导入</button>' +
        '<button class="btn" id="planClose2">关闭</button></div>' +
    '</div>';
  $('modalCancel').hidden = true; $('modalOk').hidden = true;
  openModal();
  body.querySelector('#planDoImport').onclick = function(){
    var text = body.querySelector('#planIn').value.trim();
    if(!text){ toast('请粘贴 JSON 内容', 'warn'); return; }
    var obj;
    try{ obj = parseTrainingPlan(text); }
    catch(err){ toast('导入失败：' + err.message, 'err'); return; }
    // 检测冲突（目标日期已有计划）
    var conflicts = [];
    obj.days.forEach(function(day){
      var fd = data.fitness[day.date];
      if(fd && ((fd.strength && fd.strength.length) || (fd.cardio && fd.cardio.length) || (fd.parts && fd.parts.length))) conflicts.push(day.date);
    });
    if(conflicts.length){
      confirm3('以下日期已有计划：' + conflicts.join('、') + '。\n请选择：覆盖（清空该日原有计划后写入）或 追加（保留原有并加入导入的）。',
        function(){ writeTrainingPlan(obj, 'overwrite'); closeModal(); },
        function(){ writeTrainingPlan(obj, 'append'); closeModal(); });
    }else{
      writeTrainingPlan(obj, 'overwrite');
      closeModal();
    }
  };
  body.querySelector('#planClose2').onclick = closeModal;
}
/* 三选项确认弹窗：覆盖 / 追加 / 取消 */
function confirm3(msg, onOverwrite, onAppend){
  $('modalTitle').textContent = '导入冲突';
  $('modalMsg').hidden = true;
  var body = $('modalBody');
  body.hidden = false;
  body.innerHTML = '<div class="modal-msg-inline">' + esc(msg).replace(/\n/g, '<br>') + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn" id="c3cancel">取消</button>' +
      '<button class="btn" id="c3append">追加</button>' +
      '<button class="btn primary" id="c3over">覆盖</button>' +
    '</div>';
  $('modalCancel').hidden = true; $('modalOk').hidden = true;
  openModal();
  body.querySelector('#c3cancel').onclick = closeModal;
  body.querySelector('#c3append').onclick = function(){ closeModal(); onAppend(); };
  body.querySelector('#c3over').onclick = function(){ closeModal(); onOverwrite(); };
}
$('btnExportPlan').addEventListener('click', openExportPlanModal);
$('btnImportPlan').addEventListener('click', openImportPlanModal);

/* =====================================================================
 *  启动
 * ===================================================================== */
renderAll();
